<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A realistic, vintage-style analog VU meter created with HTML, CSS, and JavaScript." />
  <title>Vintage VU Meter</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />

  <style>
    .visually-hidden {
      position: absolute !important;
      height: 1px;
      width: 1px;
      overflow: hidden;
      clip: rect(1px, 1px, 1px, 1px);
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <main class="app-container" role="main" aria-label="Vintage VU Meter Application" data-theme="neve">
    <span class="app-container-reflection" aria-hidden="true"></span>

    <span class="rack-ear rack-ear-left" aria-hidden="true">
      <span class="rack-bolt rack-bolt-top"></span>
      <span class="rack-bolt rack-bolt-bottom"></span>
    </span>
    <span class="rack-ear rack-ear-right" aria-hidden="true">
      <span class="rack-bolt rack-bolt-top"></span>
      <span class="rack-bolt rack-bolt-bottom"></span>
    </span>

    <span class="screw screw-tl" aria-hidden="true"></span>
    <span class="screw screw-tr" aria-hidden="true"></span>
    <span class="screw screw-bl" aria-hidden="true"></span>
    <span class="screw screw-br" aria-hidden="true"></span>

    <span class="power-led" aria-hidden="true"></span>
    <span class="vents" aria-hidden="true"></span>
    <span class="brand-plate" aria-hidden="true"><strong>STUDIOTECH</strong> TYPE-412 &middot; 600&Omega; CLASS-A</span>

    <section class="controls" aria-labelledby="controls-heading">
      <h2 id="controls-heading" class="visually-hidden">Audio Controls</h2>
      
      <label for="source-select" class="visually-hidden">Select Audio Source</label>
      <select id="source-select">
        <option value="">-- Select Audio Source --</option>
      </select>

      <label for="theme-select" class="visually-hidden">Select Theme</label>
      <select id="theme-select">
        <option value="neve" selected>Theme: British Console (Dark)</option>
        <option value="ssl">Theme: Modern Studio (Gray)</option>
        <option value="marantz">Theme: Vintage Hi-Fi (Silver)</option>
      </select>

      <label for="always-on-top-checkbox" class="checkbox-container">
        <input type="checkbox" id="always-on-top-checkbox" />
        <span class="custom-checkbox" aria-hidden="true"></span>
        <span>Always on Top</span>
      </label>
    </section>

    <p id="status-message" class="status-message" role="status" aria-live="polite"></p>

    <section class="meter-container" aria-labelledby="meter-heading">
      <h2 id="meter-heading" class="visually-hidden">VU Meter Visualization</h2>
      
      <canvas id="vuMeter" width="450" height="200" role="img" aria-label="Analog volume level meter"></canvas>
      
      <div id="vu-meter-reading" class="visually-hidden" aria-live="polite"></div>
    </section>
  </main>

  <span class="grain-overlay" aria-hidden="true"></span>

  <script src="renderer.js" defer></script>
</body>
</html>
